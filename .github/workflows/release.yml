name: Release

on:
  workflow_dispatch:
    inputs:
      changelog_base:
        description: 'Base ref for the changelog (default: previous fork release tag)'
        required: false
        type: string
      skip_play:
        description: 'Force-skip the Play Store job for this run'
        required: false
        type: boolean
        default: false

# A release pins one tag and one draft. Without this, two dispatches racing
# each other would fight over the same tag and the same release body.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read   # jobs that need more declare it at job level

jobs:
  # Builds the two GitHub-release APKs, hashes them for provenance, uploads
  # the shared artifact and pushes the recommended APK to Cloudflare R2.
  # Runs in parallel with the play job on a separate runner.
  apk:
    name: Build APKs (GitHub release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version name
        id: meta
        run: |
          VER=$(grep versionName ./app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "version_name=$VER" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - run: chmod +x ./gradlew

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ./app/release.jks

      - name: Build APKs (arm64-v8a + armeabi-v7a)
        run: bash build-apk.sh

      - name: Save mapping.txt (githubRelease)
        run: cp app/build/outputs/mapping/githubRelease/mapping.txt mapping-github-release.txt

      - name: Compute SHA-256 hashes
        id: hashes
        run: |
          VERSION="${{ steps.meta.outputs.version_name }}"
          echo "hashes=$(sha256sum \
            "PlainApp-${VERSION}-64bit-Recommended.apk" \
            "PlainApp-${VERSION}-Old-32bit.apk" \
            | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            PlainApp-${{ steps.meta.outputs.version_name }}-64bit-Recommended.apk
            PlainApp-${{ steps.meta.outputs.version_name }}-Old-32bit.apk
            mapping-github-release.txt
          if-no-files-found: error
          retention-days: 30

      # R2 must not block the GitHub release, so failures here are non-fatal
      # (same semantics as when this was a standalone job).
      - name: Validate R2 configuration
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing R2 configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload Recommended APK to Cloudflare R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          VERSION: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          file="PlainApp-${VERSION}-64bit-Recommended.apk"
          dest="s3://${R2_BUCKET}/${R2_PREFIX}"
          [[ "$dest" != */ ]] && dest="${dest}/"
          aws --version
          aws s3 cp "$file" "$dest" --cache-control "public, max-age=31536000, immutable"

  # Builds the googleRelease AAB and uploads it straight to the Play Store
  # internal track. The AAB is Play-Store-only: it never becomes a GitHub
  # release asset. Runs in parallel with the apk job on a separate runner.
  #
  # This fork distributes through GitHub Releases only, so the job is opt-in:
  # set the repository variable ENABLE_PLAY_PUBLISH=true to turn it on. Leaving
  # it off means no Play service-account secret is needed to cut a release.
  play:
    name: Build AAB and publish to Play Store
    if: ${{ vars.ENABLE_PLAY_PUBLISH == 'true' && inputs.skip_play != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - run: chmod +x ./gradlew

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ./app/release.jks

      # build-aab.sh patches the manifest (strips Play-restricted permissions),
      # builds the AAB, and writes play-config.json for the publisher.
      - name: Build AAB and publish to Play Store
        run: bash build-aab.sh && ./gradlew publishGoogleReleaseBundle

      # Kept as an internal artifact only (for Play Console deobfuscation);
      # it is not attached to the GitHub release.
      - name: Save mapping.txt (googleRelease)
        run: cp app/build/outputs/mapping/googleRelease/mapping.txt mapping-google-release.txt

      - name: Upload Play mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-google-release
          path: mapping-google-release.txt
          if-no-files-found: error
          retention-days: 30

  # SLSA Level 3 provenance covers the two release APKs.
  provenance:
    needs: apk
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.apk.outputs.hashes }}
      upload-assets: false

  # Creates the draft release as soon as provenance is done — it does NOT
  # wait for the VirusTotal scans, which append their table afterwards.
  release:
    needs: [apk, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history plus tags: the changelog range is resolved from the
      # previous fork release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      # Resolves what to diff against, in priority order:
      #   1. the changelog_base input, when given
      #   2. the previous fork release tag (fork versions carry an -md3.N suffix)
      #   3. the 40 commits before HEAD, for a first release
      - name: Resolve changelog base
        id: base
        env:
          INPUT_BASE: ${{ inputs.changelog_base }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BASE:-}" ]; then
            base="$INPUT_BASE"
          else
            base=$(git tag --list 'v*-md3.*' --sort=-v:refname | head -1 || true)
          fi
          if [ -z "${base:-}" ]; then
            base=$(git rev-list --max-count=40 HEAD | tail -1)
            echo "No previous fork release tag found; falling back to the last 40 commits (${base:0:9})."
          fi
          echo "Changelog range: ${base}..HEAD"
          echo "base=$base" >> $GITHUB_OUTPUT

      - name: Generate changelog
        env:
          VERSION: ${{ needs.apk.outputs.version_name }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short "$BASE" 2>/dev/null || echo "$BASE")
          {
            echo '## What'"'"'s Changed'
            echo
            if git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
              # The range holds both merged-in upstream commits and this fork's
              # own work, and git cannot reliably tell them apart after the
              # fact — so the heading stays neutral rather than claiming an
              # attribution it might get wrong.
              echo "### Changes since \`$short\`"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$BASE..HEAD" \
                | grep -v -iE '^- (chore|ci|build web|style:|test:|docs:)' \
                | head -200 || true
              echo
              echo '### About this fork'
              echo
              echo 'Builds of [`plainhub/plain-app`](https://github.com/plainhub/plain-app)'
              echo 'with one change: Material You dynamic color on Android 12+, toggleable in'
              echo '*Settings → Dark theme*. Everything else is inherited from upstream.'
            else
              echo "Could not resolve changelog base \`$BASE\`; showing the last 40 commits."
              echo
              git log --no-merges --pretty=format:'- %s (%h)' -40 HEAD
            fi
            echo
            echo '## Security'
            echo
            echo '### SLSA Provenance (Level 3)'
            echo 'The `.intoto.jsonl` file is a signed SLSA provenance document covering the release APKs.'
            echo 'Verify with [slsa-verifier](https://github.com/slsa-framework/slsa-verifier):'
            echo '```sh'
            echo "slsa-verifier verify-artifact PlainApp-${VERSION}-64bit-Recommended.apk \\"
            echo "  --provenance-path ${{ needs.provenance.outputs.provenance-name }} \\"
            echo "  --source-uri github.com/\${{ github.repository }}"
            echo '```'
            echo
            echo '> VirusTotal scans are running; the results table is appended here automatically. <!-- VT-PENDING -->'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.apk.outputs.version_name }}
          name: Release ${{ needs.apk.outputs.version_name }}
          # Input is bodyFile, not bodyPath. An unrecognised input only warns,
          # so a typo here silently produces an empty release body.
          bodyFile: release-notes.md
          draft: true
          prerelease: false
          artifacts: "PlainApp-${{ needs.apk.outputs.version_name }}-64bit-Recommended.apk,PlainApp-${{ needs.apk.outputs.version_name }}-Old-32bit.apk,${{ needs.provenance.outputs.provenance-name }},mapping-github-release.txt"

  # Scans both release APKs concurrently and appends the VirusTotal table to
  # the release body once done. The AAB is not scanned: it is only
  # distributed via Play Store.
  virustotal:
    name: VirusTotal scan (async)
    needs: [apk, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edits the release body to append the scan table
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Scan with VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          upload_and_poll() {
            local file="$1" outprefix="$2"
            local sha256 size_bytes upload_url analysis_id last_response poll_status
            local malicious suspicious undetected harmless total detected result_status
            sha256=$(sha256sum "$file" | awk '{print $1}')
            size_bytes=$(stat -c%s "$file")
            upload_url="https://www.virustotal.com/api/v3/files"
            if [ "$size_bytes" -gt 33554432 ]; then
              upload_url=$(curl -sS --request GET \
                --url https://www.virustotal.com/api/v3/files/upload_url \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
              if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
                printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
                printf '%s' "⬜ N/A" > "${outprefix}.status"
                return
              fi
            fi
            analysis_id=$(curl -sS --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" | jq -r '.data.id')
            if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
              printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
              printf '%s' "⬜ N/A" > "${outprefix}.status"
              return
            fi
            last_response=""
            for i in $(seq 1 30); do
              sleep 20
              last_response=$(curl -sS \
                --url "https://www.virustotal.com/api/v3/analyses/$analysis_id" \
                --header "x-apikey: $VT_API_KEY")
              poll_status=$(echo "$last_response" | jq -r '.data.attributes.status')
              [ "$poll_status" = "completed" ] && break
            done
            malicious=$(echo  "$last_response" | jq -r '.data.attributes.stats.malicious   // 0')
            suspicious=$(echo "$last_response" | jq -r '.data.attributes.stats.suspicious  // 0')
            undetected=$(echo "$last_response" | jq -r '.data.attributes.stats.undetected  // 0')
            harmless=$(echo   "$last_response" | jq -r '.data.attributes.stats.harmless    // 0')
            total=$((malicious + suspicious + undetected + harmless))
            detected=$((malicious + suspicious))
            [ "$detected" -eq 0 ] \
              && result_status="✅ ${detected}/${total} Clean" \
              || result_status="⚠️ ${detected}/${total} Detected"
            printf '%s' "https://www.virustotal.com/gui/file/$sha256/detection" > "${outprefix}.url"
            printf '%s' "$result_status" > "${outprefix}.status"
          }
          upload_and_poll "PlainApp-${VERSION}-64bit-Recommended.apk" /tmp/vt_default &
          upload_and_poll "PlainApp-${VERSION}-Old-32bit.apk"         /tmp/vt_armv7   &
          wait
          {
            echo "default_report=$(cat /tmp/vt_default.url)"
            echo "default_status=$(cat /tmp/vt_default.status)"
            echo "armv7_report=$(cat /tmp/vt_armv7.url)"
            echo "armv7_status=$(cat /tmp/vt_armv7.status)"
          } >> $GITHUB_OUTPUT

      - name: Append scan results to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repo from a git
          # remote and fails with "not a git repository". Name it explicitly.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version_name }}
        run: |
          gh release view "v${VERSION}" --json body -q .body > body.md
          # Replace the "scans running" placeholder with the results table.
          sed -i '/VT-PENDING/d' body.md
          {
            cat body.md
            echo ''
            echo '### VirusTotal Scan'
            echo '| File | Status | Scan Report |'
            echo '|------|--------|-------------|'
            echo "| \`PlainApp-${VERSION}-64bit-Recommended.apk\` | ${{ steps.scan.outputs.default_status }} | [View Report](${{ steps.scan.outputs.default_report }}) |"
            echo "| \`PlainApp-${VERSION}-Old-32bit.apk\` | ${{ steps.scan.outputs.armv7_status }} | [View Report](${{ steps.scan.outputs.armv7_report }}) |"
          } > new-body.md
          gh release edit "v${VERSION}" --notes-file new-body.md
